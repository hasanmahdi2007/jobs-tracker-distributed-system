server:
  port: 8083 # Runs on a dedicated port so your API Gateway (8080) can route traffic to it

spring:
  application:
    name: job-finder
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

  
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:127.0.0.1}:5432/job_finder_db
    username: postgres
    password: ${POSTGRES_PASSWORD:password}
    pool:
      enabled: true
      initial-size: 5
      max-size: 20
      max-acquire-time: 10s
      initialization-fail-fast: true


  # 3. Redis Configuration (For your Ingestion Stream)
  data:
    redis:
      host: ${REDIS_HOST:localhost} 
      port: 6379
      timeout: 5000

