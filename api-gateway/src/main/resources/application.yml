server:
  port: 8080 

spring:
  application:
    name: api-gateway

  # --- 1. ROUTING & CORS (Spring Cloud Gateway) ---
  cloud:
    gateway:
      # --- CORS FIX ADDED HERE ---
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: 
              - "http://localhost:5173"  # Notice the dash and indentation here!
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      
      routes:
        - id: job-finder-route
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/jobs/**
          filters:
            - AddRequestHeader=X-Internal-Secret, super-secret-internal-key-123!

        - id: protected-api-route
          uri: https://httpbin.org
          predicates:
            - Path=/api/v1/external/**

  # --- 2. CACHE DATABASE (Redis for Rate Limiting) ---
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

  # --- 3. MAIN DATABASE (PostgreSQL for API Keys & Authentication) ---
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/gateway_db
    username: postgres
    password: ${POSTGRES_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20

  # --- 4. ORM SETTINGS (JPA / Hibernate) ---
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect