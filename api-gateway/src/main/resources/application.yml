server:
  port: 8080 

spring:
  application:
    name: api-gateway

  # --- 1. ROUTING & CORS (Spring Cloud Gateway) ---
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: 
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      
      routes:
        - id: job-finder-route
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/jobs/**
          filters:
            - AddRequestHeader=X-Internal-Secret, super-secret-internal-key-123!

        - id: protected-api-route
          uri: https://httpbin.org
          predicates:
            - Path=/api/v1/external/**

  # --- 2. CACHE DATABASE (Redis for Rate Limiting) ---
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

  # --- 3. MAIN DATABASE (Non-Blocking R2DBC) ---
  r2dbc:
    r2dbc:
    url: r2dbc:postgresql://${DB_HOST:127.0.0.1}:5432/gateway_db
    username: postgres
    password: ${POSTGRES_PASSWORD:password}
    pool:
      enabled: true
      initial-size: 2
      max-size: 5
      max-acquire-time: 10s
      initialization-fail-fast: true

  # ALL JPA, HIBERNATE, AND JDBC DATASOURCE BLOCKS HAVE BEEN DELETED.