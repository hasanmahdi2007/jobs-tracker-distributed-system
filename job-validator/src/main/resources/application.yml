server:
  port: 0

spring:
  application:
    name: job-validator
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      timeout: 2000ms

logging:
  level:
    com.distributed.job_validator: INFO
    org.springframework.web.reactive.function.client.WebClient: WARN
    reactor.netty.http.client.HttpClientConnect: ERROR
    reactor.netty.http.client.HttpClient: ERROR